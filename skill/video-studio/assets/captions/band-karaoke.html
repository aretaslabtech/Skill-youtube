<!--
  Caption skin "band-karaoke" (video-studio asset; copy to <project>/.hyperframes/caption-skin.html).

  Same contract as glow-word.html (captions.mjs fills GROUPS / DURATION / size and the
  data-brand-tokens :root block). Token vocab used: --cap-ink · --cap-canvas · --cap-accent ·
  --font-display · --font-body. Hooks: .caption-group / .caption-word + .is-active / .is-spoken,
  root data-composition-id="captions", timeline window.__timelines["captions"].

  Visual: a full-width, semi-opaque canvas-tinted band across the frame (edge to edge; the
  words stay inside the safe x-range by padding). Words are --font-body-led sans/mono at 700.
  Upcoming words are dim; the active word FILLS left → right with the accent across its own
  spoken duration (background-clip:text sweep, seek-safe fromTo on background-position);
  spoken words settle to full ink. Made for footage looks — the band keeps captions legible
  over busy full-bleed video without a floating pill.

  Placement: 9:16 band pinned to y 1440–1600, x 64–850 (organic layout, platform-specs.md §1: the visual fills y 440–1440 and the scene continues below the captions — footage
  may run under the band, text may not); 16:9 band in y 880–1000.
-->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

<!-- captions.mjs injects the project's :root tokens here -->
<style data-brand-tokens></style>

<style>
  #captions-root { position: absolute; inset: 0; pointer-events: none; }
  .caption-layer { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
  .caption-stage {
    position: absolute; left: 0; right: 0;
    top: var(--cap-band-top, 900px); height: var(--cap-band-height, 180px);
    display: flex; align-items: center; justify-content: center;
  }
  /* 9:16 — the studio's safe caption band, not the engine's bottom band.
     The band is full-bleed (left/right 0); the text is padded to stay inside x 64–850. */
  @media (max-aspect-ratio: 9/16) {
    .caption-stage { top: 1440px; height: 160px; left: 64px; right: 230px; }
  }
  .caption-group {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
  }
  .caption-pill {
    width: 100%; height: 100%;
    box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    padding: 0 96px;
    background: color-mix(in srgb, var(--cap-canvas, #101418) 72%, transparent);
    border-top: 2px solid color-mix(in srgb, var(--cap-ink, #F1F3F0) 14%, transparent);
    border-bottom: 2px solid color-mix(in srgb, var(--cap-ink, #F1F3F0) 14%, transparent);
  }
  @media (max-aspect-ratio: 9/16) {
    .caption-pill { padding: 0 192px 0 65px; }
  }
  .caption-line {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 0.08em 0.3em;
    font-family: var(--font-body, var(--font-display, "Montserrat")), sans-serif;
    font-weight: 700;
    font-size: 56px;
    line-height: 1.16;
    letter-spacing: -0.01em;
    text-align: center;
  }
  /* 16:9 long-form — band in y 880–1000, content keeps y ≤ 860 */
  @media (min-aspect-ratio: 16/10) {
    .caption-stage { top: 880px; height: 120px; left: 0; right: 0; }
    .caption-pill { padding: 0 96px; }
    .caption-line { font-size: 46px; }
  }
  .caption-word {
    display: inline-block;
    color: color-mix(in srgb, var(--cap-ink, #F1F3F0) 42%, var(--cap-canvas, #101418));
  }
  /* active: the glyphs are painted by a two-stop gradient; sliding it fills the word L → R */
  .caption-word.is-active {
    color: transparent;
    background-image: linear-gradient(90deg,
      var(--cap-accent, #00D890) 0 50%,
      color-mix(in srgb, var(--cap-ink, #F1F3F0) 42%, var(--cap-canvas, #101418)) 50% 100%);
    background-size: 200% 100%;
    background-repeat: no-repeat;
    -webkit-background-clip: text;
    background-clip: text;
  }
  .caption-word.is-spoken { color: var(--cap-ink, #F1F3F0); background-image: none; }
  .caption-word.cap-num { font-variant-numeric: tabular-nums; }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="0"
  data-fps="30"
  data-width="0"
  data-height="0"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [];
  var DURATION = 0;

  (function () {
    var stage = document.getElementById("caption-stage");

    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (never tl.call).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start);
        tl.set(el, { className: "caption-word is-active" }, at);
        // the fill sweeps across the word over its spoken duration (gradient 100% → 0%)
        var fill = Math.max(0.1, Math.min(0.6, Number(w.end) - Number(w.start)));
        tl.fromTo(el, { backgroundPosition: "100% 0" },
          { backgroundPosition: "0% 0", duration: fill, ease: "none" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt);
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>
